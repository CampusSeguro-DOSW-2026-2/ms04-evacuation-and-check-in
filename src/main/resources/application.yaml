# Configuración de MS04. Todos los valores sensibles llegan por variables de entorno (RNF-MS04-13).
# En local se pueden poner en un archivo .env (no versionado), a partir de .env.example.
spring:
  application:
    name: ms04-evacuation-and-check-in
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crean los scripts de database/; JPA solo lo valida.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    deserialization:
      # Un campo que el contrato no define se rechaza con 400 (RG-04), p. ej. un id de usuario en el check-in
      fail-on-unknown-properties: true

server:
  # Puerto interno de MS04 (Estándares, sección 2)
  port: ${SERVER_PORT:8084}
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # El health responde exactamente {"status":"UP"} o {"status":"DOWN"}, sin detalles ni grupos (Estándares, 11)
      show-details: never
      show-components: never
      probes:
        enabled: false

logging:
  pattern:
    console: "%X{correlation_id:-sin-correlacion} %d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %logger{36} - %msg%n"
  level:
    root: ${LOG_LEVEL:INFO}

# Swagger solo en desarrollo local; nunca se expone a través del Gateway (Estándares, sección 2)
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

# Llamadas salientes de MS04 (MS01, MS02, MS05 y MS08) a través del API Gateway (Estándares, sección 5)
gateway:
  url: ${GATEWAY_URL:}
  service-key: ${GATEWAY_SERVICE_KEY:}
  timeout-ms: ${GATEWAY_TIMEOUT_MS:2000}

# Una petición que tarda más que esto queda en el log con su Correlation ID (RNF-MS04-01)
rendimiento:
  umbral-lento-ms: ${RENDIMIENTO_UMBRAL_LENTO_MS:5000}

# Rutas de los otros microservicios que MS04 llama a través del Gateway
clients:
  ms02:
    # Zona segura (punto de encuentro) por id; responde id, codigo, nombre y estado (ACTIVO o INACTIVO)
    safe-zones-path: ${MS02_SAFE_ZONES_PATH:/api/v1/safe-zones/{id}}
  ms05:
    # Ruta interna para crear la solicitud de asistencia (RF-MS04-04). PROVISIONAL: MS05 aún no publica este
    # endpoint (decisión abierta n.º 3 de los Estándares); se ajusta aquí cuando se acuerde el contrato
    solicitudes-path: ${MS05_SOLICITUDES_PATH:/api/v1/internal/solicitudes-asistencia}

# Tarea periódica que reenvía a MS05 las solicitudes de asistencia PENDIENTE_ENVIO (RN-MS04-12)
solicitudes-asistencia:
  # Milisegundos entre el fin de un reenvío y el inicio del siguiente; el primero se hace al pasar ese tiempo
  reenvio-ms: ${MS04_REENVIO_SOLICITUDES_MS:30000}

# Servicios que pueden usar las rutas internas de MS04, separados por coma (RN-MS04-23).
# El Gateway inyecta X-Service-Name como ms01 ... ms08 a partir de la clave de servicio.
internal:
  allowed-services: ${INTERNAL_ALLOWED_SERVICES:ms06}
