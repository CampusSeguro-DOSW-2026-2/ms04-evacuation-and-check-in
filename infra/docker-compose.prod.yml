# Stack de MS04 en la nube: uno por entorno en la misma VM (ms04-prod y ms04-test).
# No publica puertos: solo el Caddy de borde de la VM (red campus-edge) llega a MS04, con el alias ms04-<entorno>.
# La BD de cada entorno está en su propia VM (infra/db/docker-compose.db.yml) y MS04 llega a ella por la IP privada
# (DB_HOST:DB_PORT). Lo usa infra/deploy.sh con el .env que escribe en DEPLOY_DIR/<entorno>; no se ejecuta a mano.
name: ms04-${ENTORNO:?ENTORNO es obligatoria (test o prod)}

services:
  ms04:
    image: ${IMAGE:?IMAGE es obligatoria}:${TAG:?TAG es obligatoria (sha-xxxxxxx)}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://${DB_HOST:?DB_HOST es obligatoria (IP privada de la VM de la BD)}:${DB_PORT:?DB_PORT es obligatoria}/ms04_db
      DB_USERNAME: ms04_user
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatoria}
      SERVER_PORT: "8084"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GATEWAY_URL: ${GATEWAY_URL:?GATEWAY_URL es obligatoria (https://<dominio del GW> o :8443)}
      GATEWAY_SERVICE_KEY: ${GATEWAY_SERVICE_KEY:?GATEWAY_SERVICE_KEY es obligatoria}
      SWAGGER_ENABLED: "false"
    # Variables opcionales del entorno (p. ej. INTERNAL_ALLOWED_SERVICES, MS05_SOLICITUDES_PATH), si las hay.
    env_file:
      - path: extra.env
        required: false
    networks:
      edge:
        aliases:
          - ms04-${ENTORNO}

networks:
  edge:
    name: campus-edge
    external: true
